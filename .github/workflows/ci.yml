name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Name check, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nineeye
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nineeye
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U nineeye -d nineeye"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nineeye:ci-only-password@127.0.0.1:5442/nineeye
      TEST_DATABASE_URL: postgresql://nineeye:ci-only-password@127.0.0.1:5442/nineeye_test
      DEV_TENANT: sample-station

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the Prisma client
        run: npm -w @9eye/api run db:generate

      - name: Test database and secret key
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -p 5442 -U nineeye -d nineeye -c 'CREATE DATABASE nineeye_test OWNER nineeye;'
          echo "NINEEYE_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Name check and unit / integration tests
        run: npm test
